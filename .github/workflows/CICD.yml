name: CI  # Workflow name

on:
  push:
    branches: [ "master" ]  # Trigger on pushes to the master branch
  pull_request:
    branches: [ "master" ]  # Trigger on pull requests targeting master
  workflow_dispatch:  # Allows manual execution of the workflow

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest  # Specifies the GitHub-hosted runner OS

    # Non-secret values docker-compose.yaml substitutes. The passwords are generated
    # per run below. Compose builds the app's MONGODB_URI and RABBITMQ_URI itself.
    env:
      MONGO_NAME: ci_root
      MONGO_DB: crm_ci
      MONGO_APP_USERNAME: ci_app
      RABBITMQ_USER: ci_rabbit
      LOG_LEVEL: info

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The Compose stack only lives on this runner for the length of the job, so it
      # gets fresh random credentials every run instead of repository secrets. That
      # also lets CI run on pull requests from forks, which never receive secrets.
      - name: Generate throwaway credentials
        run: |
          for name in MONGO_PASS MONGO_APP_PASSWORD RABBITMQ_PASS; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check for unsafe DOM sinks
        run: npm run lint:sinks

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: demo-crm:ci
          cache-from: type=gha,scope=app-image
          cache-to: type=gha,mode=max,scope=app-image

      - name: Start Services
        run: |
          # Ensure a clean environment: the security tests need a fresh install
          docker compose down -v

          # --wait blocks until every service's own healthcheck (the app's included)
          # reports healthy, instead of racing the app's startup.
          docker compose up -d --wait --wait-timeout 180

          # Confirm from the runner. Docker's port proxy can accept a connection and
          # then reset it while the app is still starting, so retry every error.
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3000/api/health

      - name: Security tests
        run: npm run test:e2e

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down services
        if: always()
        run: docker compose down -v
