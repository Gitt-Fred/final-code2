name: CI  # Workflow name

on:
  push:
    branches: [ "master" ]  # Trigger on pushes to the master branch
  pull_request:
    branches: [ "master" ]  # Trigger on pull requests targeting master
  workflow_dispatch:  # Allows manual execution of the workflow

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest  # Specifies the GitHub-hosted runner OS

    # Values docker-compose.yaml substitutes. Compose builds the app's MONGODB_URI and
    # RABBITMQ_URI itself from these, so those two are not needed here.
    env:
      MONGO_NAME: ${{ secrets.MONGO_NAME }}
      MONGO_PASS: ${{ secrets.MONGO_PASS }}
      MONGO_DB: ${{ secrets.MONGO_DB }}
      MONGO_APP_USERNAME: ${{ secrets.MONGO_APP_USERNAME }}
      MONGO_APP_PASSWORD: ${{ secrets.MONGO_APP_PASSWORD }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
      RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: demo-crm:ci
          cache-from: type=gha,scope=app-image
          cache-to: type=gha,mode=max,scope=app-image

      - name: Start Services
        run: |
          # Ensure a clean environment: the security tests need a fresh install
          docker compose down -v
          docker compose up -d

          # Wait for the app to report healthy
          curl --fail --silent --retry 20 --retry-delay 5 --retry-connrefused http://localhost:3000/api/health

      - name: Security tests
        run: npm run test:e2e

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down services
        if: always()
        run: docker compose down -v
