services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_NAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    networks:
      - app_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb://${MONGO_NAME}:${MONGO_PASS}@localhost:27017/admin --quiet
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - app_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  app:
    image: demo-crm:ci
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: nextjs_app
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=${MONGO_DB}
      RABBITMQ_URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      LOG_LEVEL: ${LOG_LEVEL}
      # Session cookies are only marked Secure when this is true. Plain-HTTP local use
      # needs false; set it to true (and APP_ORIGIN) once you serve the app over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_FILES_PER_CLIENT: ${MAX_FILES_PER_CLIENT:-20}
    ports:
      - "3000:3000"
    networks:
      - app_network
    # Hardening: the app needs no extra privileges and writes nothing to its own filesystem
    # (uploaded files go to MongoDB GridFS, not disk).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    pids_limit: 200

volumes:
  mongodb_data:
    driver: local

networks:
  app_network:
    driver: bridge